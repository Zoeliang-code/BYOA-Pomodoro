<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="timer">
            <h1 class="focus-text">Focus is Key!</h1>
            <div class="time-display">25:00</div>
            <div class="controls">
                <button id="start">Start</button>
                <button id="reset">Reset</button>
            </div>
            <div class="mode-selector">
                <button class="mode active" data-time="25">Pomodoro</button>
                <button class="mode" data-time="5">Short Break</button>
                <button class="mode" data-time="15">Long Break</button>
            </div>
        </div>
    </div>
    <audio id="timerSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
